name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_discord_scope:
        description: "Send a test Discord notification for the next upcoming event (none | csc | scotland | both)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - csc
          - scotland
          - both

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          GITHUB_ACTIONS: "true"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout repository for event history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Notify Discord — CSC Official Events Channel
        env:
          DISCORD_CSC_WEBHOOK_URL: ${{ secrets.DISCORD_CSC_WEBHOOK_URL }}
          TEST_SCOPE: ${{ inputs.test_discord_scope }}
        run: |
          if [ "$TEST_SCOPE" = "csc" ] || [ "$TEST_SCOPE" = "both" ]; then
            bun run scripts/notify-discord.ts --scope csc --latest
          else
            bun run scripts/notify-discord.ts --scope csc
          fi

      - name: Notify Discord — Scotland Cyber Events Channel (Excludes CSC)
        env:
          DISCORD_SCOTLAND_WEBHOOK_URL: ${{ secrets.DISCORD_SCOTLAND_WEBHOOK_URL }}
          TEST_SCOPE: ${{ inputs.test_discord_scope }}
        run: |
          if [ "$TEST_SCOPE" = "scotland" ] || [ "$TEST_SCOPE" = "both" ]; then
            bun run scripts/notify-discord.ts --scope scotland --latest
          else
            bun run scripts/notify-discord.ts --scope scotland
          fi

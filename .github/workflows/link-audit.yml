name: Monthly External Link Health Audit

on:
  schedule:
    # Runs at 08:00 UTC on the 1st day of every month
    - cron: '0 8 1 * *'
  workflow_dispatch:

concurrency:
  group: link-audit
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  link-audit:
    name: Full Live Link Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify All Links (Bypassing 30-Day Cache)
        run: bun run check:links --force --report-only --report-file broken-links.md

      - name: File or Update Issue on Broken Links
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f broken-links.md ] && [ -s broken-links.md ]; then
            ISSUE_TITLE="[Link Health] Broken External Links Detected"
            EXISTING_ISSUE=$(gh issue list --search "$ISSUE_TITLE in:title state:open" --json number --jq '.[0].number')
            if [ -n "$EXISTING_ISSUE" ]; then
              echo "Updating existing open issue #$EXISTING_ISSUE with latest audit findings..."
              gh issue comment "$EXISTING_ISSUE" --body-file broken-links.md
            else
              echo "Filing new issue for broken external links..."
              gh issue create --title "$ISSUE_TITLE" --body-file broken-links.md --label "bug"
            fi
          else
            echo "No broken links found. Pipeline is clean."
          fi

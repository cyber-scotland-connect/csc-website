name: LinkedIn Event Promotion (Simulation & Manual Dispatch)

on:
  # NOTE: Automated cron schedules are intentionally commented out until live LinkedIn API
  # credentials (LINKEDIN_ACCESS_TOKEN / LINKEDIN_ORG_URN) are approved and enabled.
  # schedule:
  #   - cron: '0 9 * * *'     # Daily 09:00 UTC check for CSC countdown cadence (T-14, T-7, T-4, T-3, T-2, T-1, +1)
  #   - cron: '0 9 * * 2'     # Tuesdays 09:00 UTC — Stream B: Official CSC Partner Weekly Radar
  #   - cron: '0 9 * * 4'     # Thursdays 09:00 UTC — Stream C: Scottish Cyber Community Weekly Radar
  #   - cron: '0 10 1,15 * *' # 1st & 15th of month 10:00 UTC — Stream D: Bi-Weekly CSC Evergreen Org Spotlight
  workflow_dispatch:
    inputs:
      stream:
        description: 'Promotion stream to simulate (all | csc | partners | community | evergreen)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - csc
          - partners
          - community
          - evergreen
      evergreen_pillar:
        description: 'Evergreen org spotlight pillar (directory | discord | mission | speakers | sponsors | catalogue)'
        required: false
        default: 'directory'
        type: choice
        options:
          - directory
          - discord
          - mission
          - speakers
          - sponsors
          - catalogue
      csc_cadence:
        description: 'CSC cadence touchpoint override (launch | t-14 | t-7 | t-4 | t-3 | t-2 | t-1 | plus-1)'
        required: false
        default: 't-14'
        type: choice
        options:
          - launch
          - t-14
          - t-7
          - t-4
          - t-3
          - t-2
          - t-1
          - plus-1

permissions:
  contents: read

jobs:
  simulate-linkedin-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit LinkedIn Organization Handle Registry
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: bun run scripts/discover-linkedin-orgs.ts --simulate

      - name: Simulate LinkedIn Promotion Copy & First-Comment Payloads
        env:
          STREAM: ${{ inputs.stream }}
          CADENCE: ${{ inputs.csc_cadence }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          bun run scripts/promote-linkedin.ts --simulate --stream "$STREAM" --cadence "$CADENCE"

name: LinkedIn Event Promotion

on:
  schedule:
    - cron: '0 9 * * *'     # 09:00 UTC morning slot (Daily CSC countdown check)
    - cron: '0 14 * * *'    # 14:00 UTC afternoon slot (5h spacing for Tue Partner Radar, Thu Community Radar, 1st/15th Evergreen)
  workflow_dispatch:
    inputs:
      live:
        description: 'Publish live to LinkedIn (false = simulation only)'
        required: false
        default: false
        type: boolean
      stream:
        description: 'Promotion stream to simulate (all | csc | partners | community | evergreen)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - csc
          - partners
          - community
          - evergreen
      evergreen_pillar:
        description: 'Evergreen org spotlight pillar (directory | discord | mission | speakers | sponsors | catalogue)'
        required: false
        default: 'directory'
        type: choice
        options:
          - directory
          - discord
          - mission
          - speakers
          - sponsors
          - catalogue
      csc_cadence:
        description: 'CSC cadence touchpoint override (auto | launch | t-14 | t-7 | t-4 | t-3 | t-2 | t-1 | plus-1)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - launch
          - t-14
          - t-7
          - t-4
          - t-3
          - t-2
          - t-1
          - plus-1
      delete_urns:
        description: 'Comma-separated LinkedIn post URNs to delete (requires live=true)'
        required: false
        default: ''
        type: string

concurrency:
  group: linkedin-event-promotion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  simulate-linkedin-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit LinkedIn Organization Handle Registry
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: bun run scripts/discover-linkedin-orgs.ts --simulate

      - name: Run LinkedIn Promotion Engine
        env:
          STREAM: ${{ inputs.stream || 'all' }}
          CADENCE: ${{ inputs.csc_cadence || 'auto' }}
          DELETE_URNS: ${{ inputs.delete_urns || '' }}
          LIVE_MODE: ${{ github.event_name == 'schedule' || inputs.live == true }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          if [ -n "$DELETE_URNS" ] && [ "$LIVE_MODE" = "true" ]; then
            bun run scripts/promote-linkedin.ts --live --delete-urns "$DELETE_URNS"
          elif [ "$LIVE_MODE" = "true" ]; then
            bun run scripts/promote-linkedin.ts --live --stream "$STREAM" --cadence "$CADENCE"
          else
            bun run scripts/promote-linkedin.ts --simulate --stream "$STREAM" --cadence "$CADENCE"
          fi

      - name: Persist LinkedIn Promotion Ledger
        if: ${{ github.event_name == 'schedule' || inputs.live == true }}
        run: |
          if [ -f .linkedin-promotion-ledger.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .linkedin-promotion-ledger.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(linkedin): update promotion ledger [skip ci]"
              git pull --rebase origin main
              git push origin main
            fi
          fi
